<div class="tools">

</div>
<main id="main"></main>
<div class="foot">透過輸出來檢查輸入，透過寫作來閱讀 · 搭配《ABC 互動英語》2026 年 11 月號使用 · 作答紀錄只存在這台裝置</div>

<script>
/* ========== 基礎工具 ========== */
var PREFIX='abc293_';
var store={get:function(k,d){try{var v=localStorage.getItem(PREFIX+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v))}catch(e){}}};
function h(tag,props){var e=document.createElement(tag);if(props){for(var k in props){var v=props[k];if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0)e[k]=v;else e.setAttribute(k,v);}}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;if(Array.isArray(c)){c.forEach(function(x){if(x!=null)e.append(x.nodeType?x:document.createTextNode(x))})}else e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a;}
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.?!,。]+$/,'').replace(/\s+/g,' ').trim();}
function okAns(v,a){return String(a).split('|').some(function(x){return norm(x)===norm(v)});}

/* ========== 語音（含 Chrome watchdog） ========== */
var voices=[],wd=null;
function loadV(){try{voices=window.speechSynthesis?speechSynthesis.getVoices():[]}catch(e){voices=[]}}
if(window.speechSynthesis){loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}}
function pickV(){return voices.find(function(v){return v.name==='Google US English'})||voices.find(function(v){return v.lang==='en-US'})||voices.find(function(v){return /^en/i.test(v.lang)});}
function speak(t){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/_{2,}/g,' blank '));var v=pickV();if(v)u.voice=v;u.lang='en-US';u.rate=document.getElementById('slow').checked?0.65:0.92;
  clearInterval(wd);wd=setInterval(function(){if(!speechSynthesis.speaking){clearInterval(wd);return}speechSynthesis.pause();speechSynthesis.resume()},10000);
  u.onend=u.onerror=function(){clearInterval(wd)};setTimeout(function(){speechSynthesis.speak(u)},60)}catch(e){}}

/* ========== 錄音 ========== */
/* ========== 錄音引擎 v3（全站共用，一次只錄一個） ========== */
var IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var RECX={state:'idle',mr:null,stream:null,owner:null,timer:null,pending:null,idle:null};
var PLAYER=new Audio();PLAYER.preload='auto';PLAYER.setAttribute('playsinline','');var AU_UNLOCKED=false;

function unlockAudio(){if(AU_UNLOCKED)return;AU_UNLOCKED=true;try{PLAYER.src=SILENT;var p=PLAYER.play();if(p&&p.catch)p.catch(function(e){if(e&&e.name==='NotAllowedError')AU_UNLOCKED=false})}catch(e){AU_UNLOCKED=false}}
function stopAllAudio(){try{speechSynthesis.cancel()}catch(e){}try{PLAYER.pause()}catch(e){}Array.prototype.forEach.call(document.querySelectorAll('audio'),function(a){try{a.pause()}catch(e){}});}
function pickMime(){if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return '';var c=IS_IOS?['audio/mp4','audio/webm;codecs=opus','audio/webm']:['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];for(var i=0;i<c.length;i++){if(MediaRecorder.isTypeSupported(c[i]))return c[i]}return '';}

document.addEventListener('visibilitychange',function(){if(document.hidden){recStop();setTimeout(releaseMic,300)}});
function getMic(){var s=RECX.stream;if(s&&s.active&&s.getAudioTracks().some(function(t){return t.readyState==='live'}))return Promise.resolve(s);
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(st){RECX.stream=st;
    var tr=st.getAudioTracks()[0];if(!tr||!tr.muted)return st;
    return new Promise(function(res){var done=false;function go(){if(!done){done=true;res(st)}}tr.addEventListener('unmute',go,{once:true});setTimeout(go,800)});});}
function recStart(owner,maxMs,onState,onDone){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){alert('這個瀏覽器不支援錄音，請改用 Chrome 或 Safari 最新版。');return}
  unlockAudio();
  if(RECX.state==='starting')return;
  if(RECX.state==='rec'){if(RECX.owner!==owner)RECX.pending=function(){recStart(owner,maxMs,onState,onDone)};recStop();return}
  stopAllAudio();clearTimeout(RECX.idle);
  RECX.state='starting';RECX.owner=owner;onState('starting');
  getMic().then(function(stream){
    if(RECX.owner!==owner){return}
    var mime=pickMime();var mr;try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){mr=new MediaRecorder(stream)}
    var chunks=[],t0=Date.now();RECX.mr=mr;
    mr.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data)};
    mr.onstop=function(){clearTimeout(RECX.timer);var blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});var dur=Date.now()-t0;
      RECX.state='idle';RECX.mr=null;RECX.owner=null;
      if(IS_IOS)releaseMic();else{clearTimeout(RECX.idle);RECX.idle=setTimeout(releaseMic,20000)}
      var p=RECX.pending;RECX.pending=null;
      if(blob.size<600||dur<400){onState('short');if(p)setTimeout(p,120);return}
      var url=URL.createObjectURL(blob);var probe=new Audio();var fin=false;
      function ok(){if(fin)return;fin=true;onState('idle');onDone(url);if(p)setTimeout(p,120)}
      function bad(){if(fin)return;fin=true;URL.revokeObjectURL(url);onState('fail');if(p)setTimeout(p,120)}
      probe.addEventListener('loadedmetadata',ok);probe.addEventListener('canplay',ok);probe.addEventListener('error',bad);probe.preload='auto';probe.src=url;try{probe.load()}catch(e){}setTimeout(ok,1200);};
    mr.onerror=function(){try{mr.stop()}catch(e){}};
    mr.start(250);RECX.state='rec';onState('rec');
    RECX.timer=setTimeout(function(){if(RECX.mr===mr&&mr.state==='recording')recStop()},maxMs);
  }).catch(function(err){RECX.state='idle';RECX.owner=null;RECX.stream=null;onState('idle');
    alert(err&&err.name==='NotAllowedError'?'麥克風權限被拒絕：請在網址列左邊的鎖頭圖示允許「麥克風」，再重新整理。':err&&err.name==='NotReadableError'?'麥克風正被其他程式使用，請關閉其他使用麥克風的分頁或 App 後再試。':'無法使用麥克風：'+(err&&err.message||err));});}

function playURL(url,tipEl){if(!url)return;stopAllAudio();PLAYER.src=url;try{PLAYER.load()}catch(e){}var pr=PLAYER.play();
  if(pr&&pr.catch)pr.catch(function(){if(tipEl)tipEl.textContent='再按一次 ▶️ 播放'});}

/* 寫作／開口說用的長錄音 */
function recorder(){var au=h('audio',{controls:'',preload:'auto',playsinline:'',style:'display:none;max-width:100%;margin-top:6px'});var url=null;var owner={};
